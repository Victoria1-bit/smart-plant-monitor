<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Plant Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
        <a class="brand" href="/">Plant Monitor</a>
        <nav aria-label="Main">
            <a href="/" {% if active == "dashboard" %}aria-current="page"{% endif %}>Dashboard</a>
            <a href="/history" {% if active == "history" %}aria-current="page"{% endif %}>History</a>
            <a href="/watering" {% if active == "watering" %}aria-current="page"{% endif %}>Watering log</a>
            <a href="/settings" {% if active == "settings" %}aria-current="page"{% endif %}>Settings</a>
            <a href="/login" {% if active == "login" %}aria-current="page"{% endif %}>Sign in</a>
        </nav>
    </header>

    <p class="sim-note">Simulated data. No sensor or pump is connected yet.</p>

    <main id="content">
{% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', path='common.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
