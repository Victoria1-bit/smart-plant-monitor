{% extends "base.html" %}

{% block title %}Watering log{% endblock %}

{% block content %}
    <h1>Watering log</h1>
    <p id="watering-summary"></p>
    <p class="message" id="page-message" role="status"></p>

    <section class="panel">
    <table>
        <thead>
            <tr><th>Time</th><th>Started by</th><th>Duration</th><th>Moisture change</th></tr>
        </thead>
        <tbody id="watering-table"></tbody>
    </table>
    </section>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', path='watering.js') }}"></script>
{% endblock %}
