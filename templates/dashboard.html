{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
    <h1>Dashboard</h1>

    <div class="dashboard-top">
        <section class="current">
            <p class="label">Soil moisture</p>
            <p class="value"><span id="moisture">--</span>%</p>
            <p class="status" id="status">Loading</p>
            <p class="note">Last reading: <span id="last-reading">--</span></p>
        </section>


        <section class="panel">
            <h2>Low moisture light</h2>
            <p class="light-state"><span class="light-dot" id="light-dot" aria-hidden="true"></span><strong id="light-text">--</strong></p>
            <p class="note" id="light-note"></p>
        </section>
    </div>

    <p class="message" id="page-message" role="status"></p>

    <section class="panel">
        <h2>Soil moisture, last 24 hours</h2>
        <div class="chart" id="chart"></div>
        <p class="note" id="levels-note"></p>
    </section>

    <section class="panel">
        <h2>Recent readings</h2>
        <table>
            <thead>
                <tr><th>Time</th><th>Moisture</th><th>Status</th></tr>
            </thead>
            <tbody id="recent-readings"></tbody>
        </table>
    </section>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', path='chart.js') }}"></script>
    <script src="{{ url_for('static', path='dashboard.js') }}"></script>
{% endblock %}
