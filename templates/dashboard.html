{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
    <h1>Dashboard</h1>

    <div class="current">
        <p class="label">Soil moisture</p>
        <p class="value"><span id="moisture">--</span>%</p>
        <p class="status" id="status">Loading</p>
        <p class="note">Last reading: <span id="last-reading">--</span></p>
    </div>

    <p class="message" id="page-message" role="status"></p>

    <h2>Watering</h2>
    <p>Automatic watering: <strong id="auto-water">--</strong></p>
    <form id="water-form" class="inline-form">
        <label for="seconds">Seconds</label>
        <input id="seconds" type="number" min="1" max="{{ max_seconds }}" value="3" required>
        <button type="submit" id="water-button">Water now</button>
    </form>
    <p class="message" id="water-message" role="status"></p>

    <h2>Soil moisture, last 24 hours</h2>
    <div class="chart" id="chart"></div>

    <h2>Recent readings</h2>
    <table>
        <thead>
            <tr><th>Time</th><th>Moisture</th><th>Status</th></tr>
        </thead>
        <tbody id="recent-readings"></tbody>
    </table>

    <p class="note" id="levels-note"></p>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', path='chart.js') }}"></script>
    <script src="{{ url_for('static', path='dashboard.js') }}"></script>
{% endblock %}
