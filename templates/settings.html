{% extends "base.html" %}

{% block title %}Settings{% endblock %}

{% block content %}
    <h1>Settings</h1>
    <p class="note">Saved until the app restarts. These will be stored in the database later.</p>

    <form id="settings-form" class="form">
        <label for="dry_threshold">Dry below (%)</label>
        <input id="dry_threshold" type="number" min="5" max="60" required>

        <label for="wet_threshold">Wet above (%)</label>
        <input id="wet_threshold" type="number" min="40" max="95" required>

        <button type="submit">Save settings</button>
    </form>
    <p class="message" id="settings-message" role="status"></p>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', path='settings.js') }}"></script>
{% endblock %}
