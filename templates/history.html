{% extends "base.html" %}

{% block title %}History{% endblock %}

{% block content %}
    <h1>History</h1>
    <div class="filters">
        <label for="range">Time range</label>
        <select id="range">
            <option value="24">Last 24 hours</option>
            <option value="72">Last 3 days</option>
            <option value="168" selected>Last 7 days</option>
        </select>

        <label for="status-filter">Status</label>
        <select id="status-filter">
            <option value="">All</option>
            <option>Dry</option>
            <option>Normal</option>
            <option>Wet</option>
        </select>
    </div>

    <p class="message" id="page-message" role="status"></p>

    <p id="summary"></p>

    <section class="panel">
        <div class="chart" id="chart"></div>
    </section>

    <section class="panel">
    <h2>Readings</h2>
    <p><button type="button" id="download">Download CSV</button></p>
    <div class="table-scroll">
        <table>
            <thead>
                <tr><th>Time</th><th>Moisture</th><th>Status</th></tr>
            </thead>
            <tbody id="history-table"></tbody>
        </table>
    </div>
    </section>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', path='chart.js') }}"></script>
    <script src="{{ url_for('static', path='history.js') }}"></script>
{% endblock %}
